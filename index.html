<style>
  :root {
    --bg: #ffffff; --ink: #000000; --muted: #666666;
    --grid: #dfe3ea; --shadow-op: 0.5; --shadow-off: 4px;
    --cell: 36px; --ox: 0px; --oy: 0px;
    --g1: #0a84ff; --g2: #bf5af2; --g3: #ff375f; --g4: #ff9f0a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { position: relative; min-height: 100vh; }
  body { font-family: 'Archivo', 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }
  a:hover { color: #444444; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  .skip { position: absolute; left: -999px; top: 8px; background: #000; color: #fff; padding: 8px 12px; z-index: 50; }
  .skip:focus { left: 8px; }

  /* ---- paper: the two grids cover the whole viewport, aligned to the layout ---- */
  .paper { position: absolute; inset: 0; z-index: 0; pointer-events: none; background: var(--bg); }
  .paper::before, .paper::after { content: ""; position: absolute; inset: 0; background-size: var(--cell) var(--cell); }
  .paper::before {
    opacity: var(--shadow-op);
    background-image: linear-gradient(135deg, var(--g1) 0%, var(--g2) 33%, var(--g3) 66%, var(--g4) 100%);
    -webkit-mask-image: linear-gradient(to right, #000 1px, transparent 1px), linear-gradient(to bottom, #000 1px, transparent 1px);
    mask-image: linear-gradient(to right, #000 1px, transparent 1px), linear-gradient(to bottom, #000 1px, transparent 1px);
    -webkit-mask-size: var(--cell) var(--cell); mask-size: var(--cell) var(--cell);
    -webkit-mask-position: calc(var(--ox) + var(--shadow-off)) calc(var(--oy) + var(--shadow-off));
    mask-position: calc(var(--ox) + var(--shadow-off)) calc(var(--oy) + var(--shadow-off));
  }
  .paper::after {
    background-image: linear-gradient(to right, var(--grid) 1px, transparent 1px), linear-gradient(to bottom, var(--grid) 1px, transparent 1px);
    background-position: var(--ox) var(--oy);
  }

  /* ---- layout grid ---- */
  main { position: relative; z-index: 1; }
  .stage {
    display: grid;
    grid-template-columns: repeat(40, var(--cell));
    grid-template-rows: repeat(25, var(--cell));
    width: calc(var(--cell) * 40);
    height: calc(var(--cell) * 25);
    margin: var(--oy) 0 0 var(--ox);
  }
  .blk { position: relative; overflow: hidden; background: #000; display: block; color: #fff; }
  .blk img, .blk video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
  .blk .lbl { position: absolute; left: calc(var(--cell) * .33); bottom: calc(var(--cell) * .28); font-size: calc(var(--cell) * .3); font-weight: 500; letter-spacing: .08em; text-transform: uppercase; line-height: 1.2; }
  .tile .lbl { opacity: 0; transform: translateY(6px); transition: opacity .25s ease, transform .25s ease; }
  .tile:hover .lbl, .tile:focus-visible .lbl { opacity: 1; transform: none; }
  .tile:hover img, .tile:hover video { transform: scale(1.03); }
  .reel { cursor: pointer; }
  .play { position: absolute; right: calc(var(--cell) * .33); bottom: calc(var(--cell) * .28); display: flex; align-items: center; gap: .5em; font-size: calc(var(--cell) * .3); font-weight: 500; letter-spacing: .08em; text-transform: uppercase; }
  .play svg { width: 1.2em; height: 1.2em; }

  .reel  { grid-column: 2 / 26; grid-row: 2 / 15; }
  .name  { grid-column: 2 / 26; grid-row: 16 / 19; align-self: start; margin: 0; padding-top: calc(var(--cell) * .17); }
  .name svg { display: block; width: 100%; height: auto; }
  .tag   { grid-column: 2 / 26; grid-row: 19 / 20; align-self: center; margin: 0; font-size: calc(var(--cell) * .5); font-weight: 500; letter-spacing: -.01em; }
  .me    { grid-column: 2 / 4; grid-row: 20 / 22; width: calc(var(--cell) * 2); height: calc(var(--cell) * 2); border-radius: 50%; object-fit: cover; display: block; }
  .t1 { grid-column: 27 / 33; grid-row: 2 / 8; }   .t2 { grid-column: 34 / 40; grid-row: 2 / 8; }
  .t3 { grid-column: 27 / 33; grid-row: 9 / 15; }  .t4 { grid-column: 34 / 40; grid-row: 9 / 15; }
  .t5 { grid-column: 27 / 33; grid-row: 16 / 22; } .t6 { grid-column: 34 / 40; grid-row: 16 / 22; }
  nav.menu { grid-column: 2 / 40; grid-row: 23 / 25; display: flex; justify-content: space-between; align-items: center; border-top: 2px solid var(--ink); font-size: calc(var(--cell) * 1.22); font-weight: 800; letter-spacing: -.025em; text-transform: uppercase; line-height: 1; }
  nav.menu a { position: relative; }
  nav.menu a::after { content: ""; position: absolute; left: 0; right: 100%; bottom: -.08em; height: .08em; background: var(--ink); transition: right .3s cubic-bezier(.2,.7,.2,1); }
  nav.menu a:hover::after, nav.menu a:focus-visible::after { right: 0; }

  /* ---- entrance ---- */
  .in { opacity: 0; transform: translateY(10px); animation: in .7s cubic-bezier(.2,.7,.2,1) forwards; }
  .d1 { animation-delay: .05s } .d2 { animation-delay: .12s } .d3 { animation-delay: .19s } .d4 { animation-delay: .26s } .d5 { animation-delay: .33s } .d6 { animation-delay: .40s } .d7 { animation-delay: .47s } .d8 { animation-delay: .54s }
  @keyframes in { to { opacity: 1; transform: none; } }

  /* ---- lightbox ---- */
  .lb { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; padding: 24px; }
  .lb.open { display: flex; }
  .lb .frame { width: min(100%, 177.78vh); aspect-ratio: 16 / 9; background: #111; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  .lb .frame iframe { width: 100%; height: 100%; border: 0; display: block; }
  .lb .close { position: absolute; top: 20px; right: 24px; color: #fff; background: none; border: 0; font: inherit; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; padding: 8px; }

  /* ---- toast ---- */
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: #000; color: #fff; padding: 12px 18px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; opacity: 0; transition: opacity .25s, transform .25s; z-index: 45; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---- mobile: 13 columns, page scrolls, reel > name > grid > menu ---- */
  @media (max-width: 767px) {
    .stage {
      grid-template-columns: repeat(13, var(--cell));
      grid-template-rows: repeat(38, var(--cell));
      width: calc(var(--cell) * 13);
      height: auto; min-height: 100vh;
      margin: 0 0 0 var(--ox);
    }
    .reel { grid-column: 2 / 13; grid-row: 2 / 8; }
    .name { grid-column: 2 / 13; grid-row: 9 / 11; padding-top: 0; }
    .tag  { grid-column: 2 / 13; grid-row: 11 / 13; align-self: start; font-size: calc(var(--cell) * .48); line-height: 1.25; }
    .me   { grid-column: 2 / 4; grid-row: 13 / 15; }
    .t1 { grid-column: 2 / 7; grid-row: 16 / 21; }  .t2 { grid-column: 8 / 13; grid-row: 16 / 21; }
    .t3 { grid-column: 2 / 7; grid-row: 22 / 27; }  .t4 { grid-column: 8 / 13; grid-row: 22 / 27; }
    .t5 { grid-column: 2 / 7; grid-row: 28 / 33; }  .t6 { grid-column: 8 / 13; grid-row: 28 / 33; }
    .tile .lbl { opacity: 1; transform: none; }
    nav.menu { grid-column: 2 / 13; grid-row: 34 / 38; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: center; row-gap: calc(var(--cell) * .4); font-size: calc(var(--cell) * .78); }
    nav.menu a:nth-child(2n) { text-align: right; }
    nav.menu a::after { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .in { animation: none; opacity: 1; transform: none; }
    .blk img, .blk video, .tile .lbl, nav.menu a::after { transition: none; }
  }
  @media print { .paper { display: none; } }
</style>

  <button class="close" id="lbClose" type="button">Close ✕</button>
  <div class="frame" id="lbFrame">Reel — drop the Vimeo embed here</div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var root = document.documentElement;
  var stage = document.getElementById('stage');

  // Size the grid cell to the window so the layout and the paper grid stay locked together.
  function fit() {
    var w = window.innerWidth, h = window.innerHeight;
    var mobile = w < 768;
    var cell, cols, rows;
    if (mobile) { cols = 13; cell = Math.floor(w / cols); rows = null; }
    else { cols = 40; rows = 25; cell = Math.floor(Math.min(w / cols, h / rows)); }
    // Center the layout; the paper grid is offset by the same amount so its lines run through the blocks' edges.
    var ox = Math.round((w - cell * cols) / 2);
    var oy = rows ? Math.round((h - cell * rows) / 2) : 0;
    root.style.setProperty('--cell', cell + 'px');
    root.style.setProperty('--ox', ox + 'px');
    root.style.setProperty('--oy', oy + 'px');
  }
  fit();
  var t; window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(fit, 60); });

  // Reel lightbox.  To wire the real reel: set VIMEO_ID to the number from your Vimeo URL.
  var VIMEO_ID = '';
  var lb = document.getElementById('lb'), frame = document.getElementById('lbFrame'), last;
  function openLb(e) {
    e.preventDefault(); last = document.activeElement;
    if (VIMEO_ID && !frame.querySelector('iframe')) {
      frame.textContent = '';
      var f = document.createElement('iframe');
      f.src = 'https://player.vimeo.com/video/' + VIMEO_ID + '?autoplay=1&title=0&byline=0&portrait=0';
      f.allow = 'autoplay; fullscreen'; f.setAttribute('allowfullscreen', '');
      frame.appendChild(f);
    }
    lb.classList.add('open'); document.body.style.overflow = 'hidden'; document.getElementById('lbClose').focus();
  }
  function closeLb() {
    lb.classList.remove('open'); document.body.style.overflow = '';
    var f = frame.querySelector('iframe'); if (f) f.remove();
    if (last) last.focus();
  }
  document.getElementById('reel').addEventListener('click', openLb);
  document.getElementById('lbClose').addEventListener('click', closeLb);
  lb.addEventListener('click', function (e) { if (e.target === lb) closeLb(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && lb.classList.contains('open')) closeLb(); });

  // Contact: copy the email and say so.
  var toast = document.getElementById('toast'), tt;
  document.getElementById('contact').addEventListener('click', function (e) {
    e.preventDefault();
    var email = this.getAttribute('data-email');
    var done = function () {
      toast.textContent = email + ' copied'; toast.classList.add('show');
      clearTimeout(tt); tt = setTimeout(function () { toast.classList.remove('show'); }, 1800);
    };
    if (navigator.clipboard) navigator.clipboard.writeText(email).then(done, function () { location.href = 'mailto:' + email; });
    else location.href = 'mailto:' + email;
  });
})();
</script>
